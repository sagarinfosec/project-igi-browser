<!doctype html>
<!-- One ad unit, loaded by index.html inside an <iframe credentialless>. The site is cross-origin isolated
     (COOP/COEP, for WebAssembly threads), which blocks third-party ad frames; a credentialless iframe lifts
     that check for everything inside it, so this page and the frames an ad network nests in it can load.
     This file is exempt from the isolation headers in .htaccess.

     SLOTS below holds the ad network's own tag for each slot (Adsterra: paste the code the network gives, as a
     JS string, with every closing script tag written as <\/script>); index.html asks for one with ?slot=NAME.
     A slot with an empty tag renders nothing. Sizes must match index.html's placement script. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Advertisement</title>
<style>html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; } body > * { margin: 0 auto; }</style>
</head>
<body>
<script>
  var banner = function (key, w, h) {   // an Adsterra banner: its loader reads the size and key from atOptions
    return '<script>atOptions = { "key": "' + key + '", "format": "iframe", "height": ' + h + ', "width": ' + w + ', "params": {} };<\/script>' +
           '<script src="https://bauval.org/22/' + key + '"><\/script>';
  };
  var SLOTS = {
    // desktop left gutter, 160x600
    side:   { w: 160, h: 600, tag: banner('88ee443266e5bae21d941c7a963e6129', 160, 600) },
    // landing screen on desktop, 728x90
    lead:   { w: 728, h: 90,  tag: banner('91705cdb372a84b9eb000b27de6dd597', 728, 90) },
    // 300x250 (not placed at the moment: the right gutter holds the controls panel)
    box:    { w: 300, h: 250, tag: banner('9a8a33a7e554668ad010c5e115e1f057', 300, 250) },
    // landing screen on phones, 320x50
    mobile: { w: 320, h: 50,  tag: banner('73140007d2bd4b8643bf6447a5336961', 320, 50) },
    // native banner (four cards in a row), landing screen on desktop
    native: { w: 728, h: 300, tag: '<script async="async" data-cfasync="false" src="https://bauval.org/21/3bff0be464311c5f8a8de0c57d5de5b1"><\/script>' +
                                   '<div id="container-3bff0be464311c5f8a8de0c57d5de5b1"></div>' },
    // social bar (floating widgets): confined to this frame when loaded here
    social: { w: 320, h: 160, tag: '<script data-cfasync="false" src="https://bauval.org/14/2ee007ecb8fd9c8ab24ec52a03dc2a05"><\/script>' },
  };
  (function () {
    var name = new URLSearchParams(location.search).get('slot'), slot = SLOTS[name];
    if (!slot || !slot.tag) return;
    // document.write keeps the network's own <script> tags executing in order, as on a plain page
    document.write('<div id="slotbox" style="width:' + slot.w + 'px;height:' + slot.h + 'px;overflow:hidden">' + slot.tag + '</div>');
    // Fallback: a banner the network leaves empty (2026-10-31: every banner zone answered "load_watch.empty" while
    // the native and social-bar zones had ads) gives its box to a format that fills: native cards in the tall
    // boxes, the social bar's card in the strips. A banner that fills makes its own frame within a second or two.
    var FALLBACK = { side: 'native', box: 'native', lead: 'social', mobile: 'social' };
    var fb = FALLBACK[name];
    if (fb && !/no-fallback/.test(location.search)) setTimeout(function () {
      var box = document.getElementById('slotbox');
      if (!box || box.querySelector('iframe, img')) return;   // the banner came
      box.innerHTML = '';
      var add = function (src, attrs) { var sc = document.createElement('script'); sc.src = src; sc.async = true;
        for (var k in attrs) sc.setAttribute(k, attrs[k]); box.appendChild(sc); };
      if (fb === 'native') {
        var c = document.createElement('div'); c.id = 'container-3bff0be464311c5f8a8de0c57d5de5b1'; box.appendChild(c);
        add('https://bauval.org/21/3bff0be464311c5f8a8de0c57d5de5b1', { 'data-cfasync': 'false' });
      } else add('https://bauval.org/14/2ee007ecb8fd9c8ab24ec52a03dc2a05', { 'data-cfasync': 'false' });
      try { parent.postMessage({ rcAd: 1, slot: name, at: 'fallback', loader: true, requests: 0, frames: 0, images: 0, text: fb, failed: [], credentialless: '' }, '*'); } catch (e) {}
    }, 4000);
    // Diagnostics for index.html?adtest: what happened in here (the network's loader fetched? an ad frame made?
    // resources that failed?), posted to the page after a few seconds and again later.
    var failed = [];
    window.addEventListener('error', function (e) { if (e.target && e.target.src) failed.push(String(e.target.src).replace(/^https?:\/\//, '').slice(0, 40)); }, true);
    var report = function (t) {
      var res = (performance.getEntriesByType('resource') || []).map(function (r) { return r.name; });
      var msg = { rcAd: 1, slot: new URLSearchParams(location.search).get('slot'), at: t,
                  loader: res.some(function (n) { return /bauval\.org\/(22|21|14)\//.test(n); }),
                  requests: res.filter(function (n) { return !/igi\.sagarinfosec|127\.0\.0\.1/.test(n); }).length,
                  frames: document.querySelectorAll('iframe').length, images: document.images.length,
                  text: (document.body.innerText || '').trim().slice(0, 40), failed: failed.slice(0, 4),
                  credentialless: typeof window.credentialless === 'undefined' ? 'n/a' : window.credentialless };
      try { parent.postMessage(msg, '*'); } catch (e) {}
    };
    setTimeout(function () { report(4); }, 4000);
    setTimeout(function () { report(12); }, 12000);
  })();
</script>
</body>
</html>
